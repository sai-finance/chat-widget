<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradio Chat Widget</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

    <div id="chat-widget" class="chat-widget">
        <!-- Toggle Button (Use your preferred text/icon) -->
        <button id="chat-toggle" class="chat-toggle" title="Toggle Chat">Ask Subha 💬</button>

        <div id="chat-container" class="chat-container hidden">
            <!-- Header -->
            <div id="chat-header">
                <!-- Language Selector Added -->
                <div class="lang-selector">
                    <button id="lang-en" class="lang-button active" data-lang="en" title="English">EN</button>
                    <button id="lang-ta" class="lang-button" data-lang="ta" title="Tamil">தமிழ்</button> <!-- Tamil -->
                </div>
                <!-- Title (optional, might remove if header too cluttered) -->
                <!-- <h3>Assistant</h3> -->
                <div class="header-buttons">
                    <button id="new-chat" title="Start New Chat">🔄</button>
                    <button id="close-chat" title="Close Chat">×</button>
                </div>
            </div>

            <!-- Messages Area -->
            <div id="chat-messages"></div>
            <!-- Error Display Area -->
            <div id="chat-error" class="chat-error-display hidden"></div>
            <!-- Input Area -->
            <div id="chat-input-area">
                <input type="text" id="chat-input" placeholder="Ask a question..." autocomplete="off">
                <button id="send-message">Send</button>
            </div>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
